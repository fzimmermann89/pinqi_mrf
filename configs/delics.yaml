seed_everything: 42
trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 80
  precision: 32-true
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
model:
  n_subspace_coefficients: 10
  n_readout_samples: 256
  n_iterations: 4
  n_features_image_net: [48, 64, 96, 128]
  n_features_parameter_net: [64, 128, 192, 256]
  nonlinear_solver_batch_size: 2048
  lr: 0.0003
  scalar_lr_multiplier: 2.0
  weight_decay: 0.001
  loss_weights: [0.2, 0.1, 0.1, 0.8]
  ema_decay: 0.97
  ema_update_interval: 4
data:
  folder: data/delics/radial
  frame_folder: data/delics/frames
  held_out_case: case000
  case_ids: [case000, case001, case002, case003, case004, case005, case006, case007, case008, case009]
  batch_size: 8
  val_batch_size: 1
  num_workers: 2
  size: 256
  n_coils: 8
  n_timepoints: 352
  noise: [0.002, 0.006]
